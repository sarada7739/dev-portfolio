<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>制作物エディタ（ローカル）</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="bar">
      <h1>制作物エディタ</h1>
      <div class="bar-actions">
        <button type="button" id="btn-add">カードを追加</button>
        <button type="button" id="btn-publish" class="primary">公開（commit &amp; push）</button>
      </div>
    </header>

    <p id="status" role="status" class="status"></p>

    <main>
      <section id="view-list">
        <ol id="work-list" class="work-list"></ol>
      </section>

      <section id="view-form" hidden>
        <h2 id="form-heading">カードを追加</h2>
        <form id="work-form" novalidate>
          <label>タイトル
            <input type="text" id="f-title" required maxlength="200" />
          </label>
          <label>説明
            <textarea id="f-description" rows="3" maxlength="1000"></textarea>
          </label>
          <label>年
            <input type="text" id="f-year" maxlength="50" />
          </label>
          <label>GitHub URL（任意）
            <input type="url" id="f-github" placeholder="https://github.com/..." maxlength="500" />
          </label>
          <label>リンク URL（任意・空なら &quot;#&quot;）
            <input type="url" id="f-href" placeholder="https://..." maxlength="500" />
          </label>
          <label>slug（画像ファイル名に使用）
            <input type="text" id="f-slug" required maxlength="64" />
          </label>

          <fieldset>
            <legend>画像（5:3 に切り抜き）</legend>
            <div id="drop" class="drop" tabindex="0">
              ここに画像（png / jpg / webp）をドラッグ&amp;ドロップ、またはクリックして選択
              <input type="file" id="f-file" accept="image/png,image/jpeg,image/webp" hidden />
            </div>
            <p id="image-note" class="note"></p>
            <div id="cropper" class="cropper" hidden>
              <div id="stage" class="stage">
                <canvas id="stage-canvas"></canvas>
                <div class="clip"><div id="shade" class="shade"></div></div>
                <div id="crop-box" class="crop-box">
                  <span class="handle nw" data-corner="nw"></span>
                  <span class="handle ne" data-corner="ne"></span>
                  <span class="handle sw" data-corner="sw"></span>
                  <span class="handle se" data-corner="se"></span>
                </div>
              </div>
              <div class="preview">
                <p>サムネイルのプレビュー（1200×720）</p>
                <canvas id="preview-canvas" width="300" height="180"></canvas>
              </div>
            </div>
          </fieldset>

          <div class="form-actions">
            <button type="submit" class="primary">保存</button>
            <button type="button" id="btn-cancel">キャンセル</button>
          </div>
        </form>
      </section>

      <section id="view-result" hidden>
        <h2 id="result-heading"></h2>
        <pre id="result-log" class="log"></pre>
        <button type="button" id="btn-result-close">閉じる</button>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
